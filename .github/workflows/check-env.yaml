name: check-env

on:
  push:
    paths:
      - check-env.sh
      - tests/check-env.bats
      - .github/workflows/check-env.yaml
  pull_request:
    paths:
      - check-env.sh
      - tests/check-env.bats
      - .github/workflows/check-env.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run ShellCheck
        run: shellcheck check-env.sh

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.bash }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          # macOS ships bash 3.2 and BSD awk.
          - os: macos-latest
            bash: /bin/bash
    steps:
      - uses: actions/checkout@v5

      - name: Show versions
        run: |
          "${{ matrix.bash }}" --version | head -n 1
          awk --version 2>/dev/null | head -n 1 || awk -W version 2>&1 | head -n 1 || true

      - name: Setup Bats
        uses: bats-core/bats-action@4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The tests use no helper library.
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Run tests
        shell: bash
        env:
          BASH_BIN: ${{ matrix.bash }}
          TERM: xterm
        run: bats -p --print-output-on-failure tests/check-env.bats
